services:
  db:
    image: postgres:16-alpine
    container_name: plantmate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plantmate}
      POSTGRES_USER: ${POSTGRES_USER:-plantmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - plantmate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plantmate} -d ${POSTGRES_DB:-plantmate}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  plantmate_postgres_data:
